<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Aviso legal · Autismo Familiar</title>
  <meta name="description" content="Información de contacto de Autismo Familiar.">
  <style>
    :root{--navy:#16485c;--cyan:#0d96a9;--text:#315865;--line:#dcebed;--bg:#f7fbfc}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 Arial,sans-serif}
    header{background:#fff;border-bottom:1px solid var(--line)}
    .bar{max-width:900px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}
    .brand{font-weight:900;color:var(--navy);text-decoration:none;font-size:19px} .brand img{display:block;width:220px;height:auto;max-height:56px;object-fit:contain} @media(max-width:600px){.brand img{width:190px;max-height:48px}}
    .back{font-size:13px;font-weight:800;color:var(--cyan);text-decoration:none}
    main{max-width:760px;margin:48px auto;padding:0 22px 60px}
    .kicker{font-size:11px;font-weight:900;letter-spacing:1.5px;color:var(--cyan);text-transform:uppercase}
    h1{color:var(--navy);font-size:clamp(30px,5vw,42px);line-height:1.15;margin:8px 0 24px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 8px 24px #16485c08}
    .item{padding:14px 0;border-bottom:1px solid var(--line)}
    .item:last-child{border-bottom:0;padding-bottom:0}
    .label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#6a8790;margin-bottom:4px}
    .value{font-size:17px;font-weight:700;color:var(--navy);overflow-wrap:anywhere}
    a.email{color:#087e92;text-decoration:underline}
    @media(max-width:600px){main{margin:28px auto;padding:0 14px 36px}.panel{padding:19px}.bar{padding:14px}}
  </style>
</head>
<body>
  <header><div class="bar"><a class="brand" href="/" aria-label="Autismo Familiar"><img src="/uploads/logo-autismo-familiar.png" alt="Autismo Familiar"></a><a class="back" href="/">← Volver a la web</a></div></header>
  <main>
    <div class="kicker">Información del proyecto</div>
    <h1>Aviso legal</h1>
    <section class="panel" aria-label="Datos del proyecto y contacto">
      <div class="item"><span class="label">Nombre del proyecto</span><div class="value">Autismo Familiar</div></div>
      <div class="item"><span class="label">Responsable</span><div class="value">Mariano</div></div>
      <div class="item"><span class="label">Correo electrónico</span><div class="value"><a class="email" href="mailto:autismofamiliar@autismofamiliar.com">autismofamiliar@autismofamiliar.com</a></div></div>
    </section>
  </main>
</body>
</html>
